<title>ひとりび</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap">
<style>
/* 一本の縦長カラム。上にみんなの行動ログ、下に自分の一手を固定、さらに下にタブ。色は「灯」の橙を合図の色にだけ使う */
:root {
  --bg: #f6f4f0;
  --surface: #fffdfa;
  --line: #e4ded4;
  --ink: #23201b;
  --ink-2: #5f584d;
  --ink-3: #8f877a;
  --ember: #c4581a;
  --ember-soft: #fbeadc;
  --ok: #3f7a52;
  --ok-soft: #e3f0e6;
  --danger: #b2433a;
  --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151310; --surface: #1e1b17; --line: #34302a; --ink: #eee8de; --ink-2: #bdb4a6; --ink-3: #8a8274;
    --ember: #f08a4b; --ember-soft: #3a2415; --ok: #7cc293; --ok-soft: #1d3325; --danger: #ef8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151310; --surface: #1e1b17; --line: #34302a; --ink: #eee8de; --ink-2: #bdb4a6; --ink-3: #8a8274;
  --ember: #f08a4b; --ember-soft: #3a2415; --ok: #7cc293; --ok-soft: #1d3325; --danger: #ef8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 200px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 12px 8px; }
.brand { font-family: var(--display); font-size: 20px; letter-spacing: .14em; display: flex; align-items: center; gap: 10px; }
.flame { width: 10px; height: 10px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 4px var(--ember-soft); flex: none; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.linkbtn { background: none; border: 0; color: var(--ink-2); text-decoration: underline; font-size: 13px; padding: 4px; }

h1, h2 { font-family: var(--display); font-weight: 600; letter-spacing: .04em; text-wrap: balance; }
h1 { font-size: 22px; margin: 6px 0 2px; }
h2 { font-size: 16px; margin: 22px 0 8px; }
.lead { color: var(--ink-2); margin: 0 0 12px; font-size: 14px; }
.muted { color: var(--ink-3); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap-row { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.pulse { display: flex; align-items: baseline; gap: 6px; margin: 8px 0 14px; font-family: var(--display); color: var(--ink-2); }
.pulse b { font-size: 34px; color: var(--ember); font-weight: 600; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.log { display: flex; gap: 12px; align-items: flex-start; }
.log img { width: 32px; height: 32px; border-radius: 50%; flex: none; margin-top: 2px; }
.log .goal { font-weight: 500; overflow-wrap: anywhere; }
.log.done .goal { color: var(--ink-3); }
.meta { font-size: 12px; color: var(--ink-3); }
.chip { display: inline-block; font-size: 11px; line-height: 1.6; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.ember { border-color: var(--ember); color: var(--ember); }
.chip.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 38px; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ember); border-color: var(--ember); color: #fff; font-weight: 700; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 3px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.on { border-color: var(--ember); color: var(--ember); }

input[type=text], input[type=url], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
textarea { resize: vertical; min-height: 46px; }
label.f { display: block; font-size: 13px; color: var(--ink-2); }
label.f > input, label.f > select, label.f > textarea { margin-top: 4px; }
.warn { font-size: 12px; color: var(--ink-3); }
.warn::before { content: "！ "; color: var(--ember); }

.empty { text-align: center; color: var(--ink-3); padding: 28px 8px; }

/* 下の固定欄：自分の一手 */
.mybar { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 8; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.mybar .in { max-width: 560px; margin: 0 auto; background: var(--surface); border: 1.5px solid var(--ember); border-radius: 16px; padding: 10px 12px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 8px; }
.mybar .label { font-size: 12px; color: var(--ember); font-weight: 700; }
.mybar .goal { font-weight: 700; overflow-wrap: anywhere; }
.mybar .ask { background: var(--ember-soft); border-radius: 10px; padding: 8px 10px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 10px 0 12px; font-size: 13px; color: var(--ink-3); position: relative; }
.tab.active { color: var(--ink); font-weight: 700; }
.tab.active::after { content: ""; position: absolute; left: 30%; right: 30%; top: 0; height: 2px; background: var(--ember); }
.badge { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; border-radius: 8px; background: var(--ember); color: #fff; font-size: 10px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }

/* 15分相談を出す：1問ずつ */
.wizard .q { font-family: var(--display); font-size: 20px; margin: 8px 0 12px; }
.choice { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.choice b { display: block; }
.choice span { font-size: 13px; color: var(--ink-3); }
.choice:hover, .choice.on { border-color: var(--ember); }
.steps-dots { display: flex; gap: 6px; }
.steps-dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.steps-dots i.on { background: var(--ember); }

/* 相談部屋 */
.timer { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--ember); }
.msgs { display: flex; flex-direction: column; gap: 8px; min-height: 120px; max-height: 46vh; overflow-y: auto; padding: 4px 2px; }
.msg { max-width: 82%; padding: 7px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.msg.mine { align-self: flex-end; background: var(--ember-soft); border-color: transparent; }
.linkbox { background: var(--ember-soft); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }
.linkbox a { color: var(--ink); font-weight: 700; }

/* やめる決断の学び */
.lesson dl { margin: 6px 0 0; }
.lesson dt { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.lesson dd { margin: 0; overflow-wrap: anywhere; }

.toast { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); z-index: 20; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--danger); color: #fff; }
/* 学び */
.learn-ctx { font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; display: inline-block; margin-bottom: 12px; }
.learn-card { background: var(--surface); border: 1.5px solid var(--ember); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.learn-card h2 { margin: 0; font-size: 20px; }
.learn-card .body { line-height: 1.85; }
.learn-try { background: var(--ember-soft); border-radius: 12px; padding: 10px 12px; }
.learn-try b { display: block; font-size: 12px; color: var(--ember); }
.learn-src { font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
.learn-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; } .learn-bar i { display: block; height: 100%; background: var(--ember); }
.celebrate { background: var(--ok-soft); border: 1px solid var(--ok); color: var(--ink); border-radius: 14px; padding: 12px 14px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="flame" aria-hidden="true"></span>ひとりび</div>
    <div class="who" id="who"></div>
  </header>
  <main id="view"><p class="empty">読み込んでいます……</p></main>
</div>
<div class="mybar" id="mybar" hidden></div>
<nav class="tabs" aria-label="メイン"><div class="in">
  <button class="tab" data-tab="logs">行動ログ</button>
  <button class="tab" data-tab="ask">15分相談<span class="badge" id="b-ask" hidden></span></button>
  <button class="tab" data-tab="learn">学び</button>
  <button class="tab" data-tab="notes">通知<span class="badge" id="b-notes" hidden></span></button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="lessons.js"></script>
<script>
(() => {
  // ---------- 定数 ----------
  const STEPS = ['コンセプトと課題検証', '仕様設計', '画面設計', 'プロトタイプ実装', '価値検証', '価格設計', '本番実装', 'デザイン', 'セキュリティと公開準備', 'ローンチ', '計測・運用・継続判断'];
  const KINDS = { see: { label: '見てほしい', hint: '画面や資料を見て、ひとこと' }, listen: { label: '話を聞いてほしい', hint: '壁打ち。答えはいらない' }, touch: { label: '触ってほしい', hint: '試作品を5分触ってほしい' } };
  const GESTURES = ['ありがとう', '助かった', 'またどこかで'];
  const H = 3600e3, DAY = 24 * H;
  const SECRET_NOTE = '会社名・数字・顧客名は書かないでください';

  // ---------- 道具 ----------
  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
    return el;
  }
  let toastT;
  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(() => (t.className = 'toast'), 2600);
  }
  function ago(t) {
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 1) return 'たった今'; if (m < 60) return m + '分前';
    const hr = Math.floor(m / 60); if (hr < 24) return hr + '時間前';
    return Math.floor(hr / 24) + '日前';
  }
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  async function act(fn, ok) {
    try { await fn(); if (ok) toast(ok); } catch (e) {
      const code = e && e.code;
      if (code) console.error(e);
      toast(code === 'quota_exceeded' ? '保存できる量の上限に達しました。運営者に知らせてください' : code === 'invalid_argument' ? 'この操作をする権限がありません' : (e && e.message && !code ? e.message : '保存できませんでした。もう一度お試しください'), true);
    }
    render();
  }
  function fail(msg) { throw new Error(msg); }

  // ---------- 状態 ----------
  const S = {
    ready: false, db: null, user: null, me: null, isOwner: false, readOnly: false,
    logs: new Map(), cheers: [], signs: [], lessons: [], bows: [], thanks: [], experts: new Map(),
    myPending: [], myOutcomes: [], learnRead: null, learnSkip: [], allPending: [], allOutcomes: [], profiles: {},
    tab: 'logs', wizard: null, roomId: null, room: null, roomMsgs: [], roomUnsubs: [], lessonForm: false,
    celebrate: null, editing: false, dismissAskDone: ls.get('hb.dismiss') || '',
  };

  // ---------- 起動 ----------
  async function boot() {
    const [db, user] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    if (!db || !user) {
      $('view').replaceChildren(h('div', { class: 'card stack' }, h('h1', {}, 'ここでは使えません'), h('p', { class: 'lead' }, 'ひとりびは、claude.ai にサインインして、共有されたリンクから開くと使えます。')));
      return;
    }
    S.db = db; S.user = user;
    const me = await user.me();
    if (!me.id) {
      $('view').replaceChildren(h('div', { class: 'card stack' }, h('h1', {}, 'サインインが必要です'), h('p', { class: 'lead' }, 'claude.ai にサインインしてから開き直してください。')));
      return;
    }
    S.me = me.id; S.isOwner = me.isOwner;
    const cw = await user.can('data.write');
    S.readOnly = cw === false;
    $('who').replaceChildren(...[h('img', { src: me.avatarUrl, alt: '' }), h('span', {}, me.name || 'あなた'), S.isOwner ? h('button', { class: 'linkbtn', onclick: () => go('admin') }, '運営') : null].filter(Boolean));
    subscribe();
    const slow = setTimeout(() => { if (!S.ready) { S.ready = true; render(); toast('データにまだつながっていません。表示が古い可能性があります', true); } }, 10000);
    S._slow = slow;
    setInterval(() => { if (S.tab === 'room') renderTimerOnly(); }, 1000);
    setInterval(() => { if (S.tab !== 'room' && S.tab !== 'quit' && !S.wizard && !isTyping()) render(); }, 30000);
  }
  const isTyping = () => document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);

  function listen(q, fn) {
    return q.onSnapshot((snap) => {
      fn(snap);
      if (!snap.metadata.fromCache && !S.ready) { S.ready = true; clearTimeout(S._slow); }
      render();
    }, (e) => { console.error(e); if (e.code === 'revoked') toast('このページへの権限が変わりました', true); });
  }
  const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));

  function subscribe() {
    const db = S.db, me = S.me;
    listen(db.collection('logs'), (s) => { S.logs = new Map(s.docs.map((d) => [d.id, d.data()])); });
    listen(db.collection('cheers'), (s) => { S.cheers = docs(s); });
    listen(db.collection('signs'), (s) => { S.signs = docs(s); });
    listen(db.collection('lessons'), (s) => { S.lessons = docs(s); });
    listen(db.collection('bows'), (s) => { S.bows = docs(s); });
    listen(db.collection('thanks').where('to', '==', me), (s) => { S.thanks = docs(s); });
    listen(db.collection('experts'), (s) => { S.experts = new Map(s.docs.map((d) => [d.id, d.data()])); });
    listen(db.doc('pending/' + me), (d) => { S.myPending = d.exists ? d.data().items || [] : []; });
    listen(db.doc('data/users/' + me + '/learn'), (d) => { S.learnRead = d.exists ? d.data().read || [] : []; });
    listen(db.doc('outcomes/' + me), (d) => { S.myOutcomes = d.exists ? d.data().items || [] : []; });
    if (S.isOwner) {
      listen(db.collection('pending'), (s) => { S.allPending = docs(s); });
      listen(db.collection('outcomes'), (s) => { S.allOutcomes = docs(s); });
    }
  }

  // ---------- 見方 ----------
  const myLog = () => S.logs.get(S.me) || null;
  const isLit = (l) => l && Date.now() - l.litAt < DAY;
  const passedSteps = (uid) => (S.logs.get(uid)?.passed || []);
  const expertSteps = (uid) => (S.experts.get(uid)?.steps || []);
  function marks(uid, step) {
    const out = [];
    if (step && passedSteps(uid).includes(step)) out.push(h('span', { class: 'chip ok' }, `ステップ${step} 通過`));
    else if (passedSteps(uid).length) out.push(h('span', { class: 'chip' }, `通過 ${passedSteps(uid).length}ステップ`));
    if (S.experts.has(uid)) out.push(h('span', { class: 'chip ember' }, '招待した経験者'));
    return out;
  }
  const name = (uid) => (S.profiles[uid]?.name) || '名前を読めない人';
  const avatar = (uid) => S.profiles[uid]?.avatarUrl || '';
  const fresh = (s) => s.status !== 'open' || Date.now() - s.createdAt < 2 * H; // 応じられていない相談は2時間で消える
  const mySign = () => S.signs.find((s) => s.uid === S.me && fresh(s)) || null;
  const myResponding = () => S.signs.filter((s) => s.responder === S.me && s.status === 'matched');
  function pendingAskDone() {
    // 相談を終えたあと、まだ「できた」になっていない一手（48時間以内）
    const l = myLog();
    return S.myOutcomes.filter((o) => !o.doneAt && Date.now() - o.closedAt < 2 * DAY && l && l.litAt === o.litAt && !l.doneAt && S.dismissAskDone !== o.signId);
  }

  // ---------- 書き込み ----------
  async function lightFire(goal, step) {
    goal = goal.trim();
    if (!goal) fail('今日の一手を書いてください');
    if (goal.length > 40) fail('今日の一手は40字までです');
    const prev = myLog() || {};
    const days = Array.from(new Set([...(prev.days || []), today()])).slice(-60);
    await S.db.doc('logs/' + S.me).set({ goal, step, litAt: Date.now(), doneAt: null, passed: prev.passed || [], days });
  }
  async function markDone() {
    const l = myLog(); if (!l) return;
    const now = Date.now();
    const passed = Array.from(new Set([...(l.passed || []), l.step])).sort((a, b) => a - b);
    await S.db.doc('logs/' + S.me).update({ doneAt: now, passed });
    const outs = S.myOutcomes.map((o) => (!o.doneAt && o.litAt === l.litAt && now - o.closedAt < 2 * DAY ? { ...o, doneAt: now } : o));
    if (outs.some((o, i) => o !== S.myOutcomes[i])) await S.db.doc('outcomes/' + S.me).set({ items: outs });
    S.celebrate = { step: l.step, afterAsk: outs.some((o, i) => o !== S.myOutcomes[i]) };
  }
  async function cheer(uid) {
    const l = S.logs.get(uid); if (!l) return;
    await S.db.doc(`cheers/${uid}~${l.litAt}~${S.me}`).set({ to: uid, litAt: l.litAt, from: S.me, at: Date.now() });
  }
  async function postSign(w) {
    const l = myLog();
    if (!isLit(l) || l.doneAt) fail('先に今日の一手を書いてください');
    if (mySign()) fail('相談は一度に1つまでです');
    for (const old of S.signs.filter((s) => s.uid === S.me && !fresh(s))) await S.db.doc('signs/' + old.id).delete();
    const aff = w.aff === 'none' ? '' : (w.affText || '').trim().slice(0, 40);
    await S.db.collection('signs').add({ uid: S.me, goal: l.goal, step: l.step, litAt: l.litAt, kind: w.kind, minutes: w.minutes, aff, affType: w.aff, status: 'open', responder: null, createdAt: Date.now() });
  }
  async function offer(signId) {
    const ref = S.db.doc('signs/' + signId);
    const lease = await ref.acquire({ holder: S.me, ttlMs: 5000 });
    if (!lease.acquired) fail('ほかの人が応じているところです');
    const s = await ref.get();
    if (!s.exists || s.data().status !== 'open') fail('その相談には、もう誰かが応じました');
    await ref.update({ status: 'offered', responder: S.me, offeredAt: Date.now() });
  }
  async function decline(signId) { await S.db.doc('signs/' + signId).update({ status: 'open', responder: null }); }
  async function startRoom(sign) {
    const now = Date.now();
    await S.db.doc('rooms/' + sign.id).set({ asker: sign.uid, responder: sign.responder, startedAt: now, endsAt: now + sign.minutes * 60e3, link: '', step: sign.step });
    await S.db.doc('signs/' + sign.id).update({ status: 'matched', startedAt: now });
    go('room', sign.id);
  }
  async function withdraw(signId) { await S.db.doc('signs/' + signId).delete(); }
  async function sendMsg(text) {
    text = text.trim(); if (!text) return;
    if (text.length > 200) fail('200字までです');
    await S.db.collection(`rooms/${S.roomId}/msgs`).add({ uid: S.me, text, at: Date.now() });
  }
  async function setLink(url, confirmed) {
    url = url.trim();
    if (!/^https:\/\/[^\s]+$/.test(url)) fail('https:// で始まるリンクを貼ってください');
    if (!confirmed) fail('会社名・数字・顧客名を伏せたかを確かめてください');
    await S.db.doc('rooms/' + S.roomId).update({ link: url, linkBy: S.me });
  }
  async function cleanupRoom(roomId) {
    const msgs = await S.db.collection(`rooms/${roomId}/msgs`).get();
    for (const d of msgs.docs) await S.db.doc(`rooms/${roomId}/msgs/${d.id}`).delete();
    await S.db.doc('rooms/' + roomId).delete();
    await S.db.doc('signs/' + roomId).delete();
  }
  async function finishAsAsker(movedOn, gesture) {
    const r = S.room; const sign = S.signs.find((s) => s.id === S.roomId);
    const now = Date.now();
    const items = [...S.myOutcomes.filter((o) => o.signId !== S.roomId), { signId: S.roomId, step: r.step, litAt: sign ? sign.litAt : myLog()?.litAt, movedOn, closedAt: now, doneAt: null, responder: r.responder }];
    await S.db.doc('outcomes/' + S.me).set({ items });
    if (gesture) await S.db.doc(`thanks/${S.roomId}~${S.me}`).set({ to: r.responder, from: S.me, g: gesture, at: now });
    const id = S.roomId;
    leaveRoom();
    await cleanupRoom(id);
    go('logs');
  }
  async function thankAsResponder(gesture, askerId, roomId) {
    await S.db.doc(`thanks/${roomId}~${S.me}`).set({ to: askerId, from: S.me, g: gesture, at: Date.now() });
  }
  async function submitLesson(f) {
    const L = (s) => (s || '').trim();
    if (!L(f.learned) || !L(f.carry) || !L(f.drop)) fail('3行とも書いてください');
    if ([f.learned, f.carry, f.drop].some((s) => L(s).length > 60)) fail('1行は60字までです');
    const item = { id: 'l' + Date.now().toString(36), uid: S.me, step: f.step, type: f.type, learned: L(f.learned), carry: L(f.carry), drop: L(f.drop), showName: !!f.showName, status: 'pending', at: Date.now() };
    await S.db.doc('pending/' + S.me).set({ items: [...S.myPending, item] });
  }
  async function deleteMyPending(id) { await S.db.doc('pending/' + S.me).set({ items: S.myPending.filter((i) => i.id !== id) }); }
  async function bow(lesson) { await S.db.doc(`bows/${lesson.id}~${S.me}`).set({ lesson: lesson.id, to: lesson.uid, from: S.me, at: Date.now() }); }
  // 運営者
  async function approve(owner, item) {
    await S.db.doc('lessons/' + item.id).set({ uid: item.uid, step: item.step, type: item.type, learned: item.learned, carry: item.carry, drop: item.drop, showName: item.showName, at: item.at, publishedAt: Date.now() });
    const doc = S.allPending.find((p) => p.id === owner);
    await S.db.doc('pending/' + owner).set({ items: (doc?.items || []).filter((i) => i.id !== item.id) });
  }
  async function sendBack(owner, item) {
    const doc = S.allPending.find((p) => p.id === owner);
    await S.db.doc('pending/' + owner).set({ items: (doc?.items || []).map((i) => (i.id === item.id ? { ...i, status: 'returned' } : i)) });
  }
  async function setExpert(uid, steps) {
    if (!steps.length) return S.db.doc('experts/' + uid).delete();
    await S.db.doc('experts/' + uid).set({ steps, at: Date.now() });
  }

  // ---------- 相談部屋の購読 ----------
  function enterRoom(id) {
    leaveRoom();
    S.roomId = id; S.room = undefined; S.roomMsgs = [];
    S.roomUnsubs.push(S.db.doc('rooms/' + id).onSnapshot((d) => { S.room = d.exists ? d.data() : null; render(); }, () => {}));
    S.roomUnsubs.push(S.db.collection(`rooms/${id}/msgs`).orderBy('at').onSnapshot((s) => { S.roomMsgs = docs(s); render(); scrollMsgs(); }, () => {}));
  }
  function leaveRoom() { S.roomUnsubs.forEach((u) => u()); S.roomUnsubs = []; }
  function scrollMsgs() { const m = document.querySelector('.msgs'); if (m) m.scrollTop = m.scrollHeight; }

  // ---------- 画面の切り替え ----------
  function go(tab, arg) {
    if (tab !== 'room' && S.tab === 'room') leaveRoom();
    S.tab = tab; S.wizard = null; S.editing = false; if (tab !== 'logs') S.quitDone = false;
    if (tab === 'room') enterRoom(arg);
    if (tab === 'notes') ls.set('hb.seen', String(Date.now()));
    render(); window.scrollTo(0, 0);
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => go(b.dataset.tab)));

  // ---------- 描画 ----------
  let renderSeq = 0;
  async function render() {
    if (!S.db) return;
    const seq = ++renderSeq;
    const ids = new Set([S.me]);
    S.logs.forEach((_, k) => ids.add(k));
    S.signs.forEach((s) => { ids.add(s.uid); if (s.responder) ids.add(s.responder); });
    S.lessons.forEach((l) => l.showName && ids.add(l.uid));
    S.thanks.forEach((t) => ids.add(t.from));
    S.experts.forEach((_, k) => ids.add(k));
    if (S.room) { ids.add(S.room.asker); ids.add(S.room.responder); }
    S.allPending.forEach((p) => ids.add(p.id));
    S.profiles = await S.user.profiles([...ids]);
    if (seq !== renderSeq) return;
    // 描き直しても、入力中の値・チェック・開いた欄を守る
    const a = document.activeElement; const keep = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
    const vals = {};
    document.querySelectorAll('#view [id], #mybar [id]').forEach((el) => {
      if (el.tagName === 'DETAILS') vals[el.id] = { open: el.open };
      else if (el.type === 'checkbox') vals[el.id] = { checked: el.checked };
      else if ('value' in el && /INPUT|TEXTAREA|SELECT/.test(el.tagName)) vals[el.id] = { value: el.value };
    });
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === (S.tab === 'room' ? 'ask' : S.tab === 'quit' ? 'logs' : S.tab)));
    const view = !S.ready ? h('p', { class: 'empty' }, '読み込んでいます……')
      : S.tab === 'ask' ? (S.wizard ? viewWizard() : viewAsk())
      : S.tab === 'room' ? viewRoom()
      : S.tab === 'quit' ? viewQuit()
      : S.tab === 'learn' ? viewLearn()
      : S.tab === 'notes' ? viewNotes()
      : S.tab === 'admin' && S.isOwner ? viewAdmin()
      : viewLogs();
    $('view').replaceChildren(view);
    renderMyBar();
    renderBadges();
    for (const [id, v] of Object.entries(vals)) { const el = $(id); if (!el) continue; if ('open' in v) el.open = v.open; else if ('checked' in v) el.checked = v.checked; else if (S._clear !== id) el.value = v.value; }
    S._clear = null;
    if (keep) { const el = $(keep.id); if (el && !el.disabled) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch {} } }
  }

  // 行動ログ（骨格B：みんなの行動ログが先）
  function viewLogs() {
    const lit = [...S.logs.entries()].filter(([, l]) => isLit(l)).sort((a, b) => b[1].litAt - a[1].litAt);

    const feed = [

    ].sort((a, b) => b.at - a.at);
    return h('div', {},
      h('div', { class: 'pulse' }, 'いま', h('b', {}, working), '人が一手に取り組んでいる'),

      h('h2', {}, 'みんなの行動ログ'),

      end = h('div', { class: 'card stack' }, h('b', {}, '終えるとき'), h('div', { class: 'muted' }, 'お礼（任意）'), gs,
        h('div', {}, '動き出せそうですか？'),
        h('div', { class: 'row' }, h('button', { class: 'btn ok grow', onclick: () => act(() => finishAsAsker(true, g), '相談を終えました') }, '動き出せた'), h('button', { class: 'btn grow', onclick: () => act(() => finishAsAsker(false, g), '相談を終えました') }, 'まだ')),
        h('div', { class: 'muted' }, '終えると、この部屋のやりとりとリンクは消えます。'));
    } else {
      end = h('div', { class: 'card stack' }, h('b', {}, '終えるとき'), h('div', { class: 'muted' }, '相談を終えるのは、相談した人です。お礼を送って抜けることもできます。'),
        h('div', { class: 'row wrap-row' }, GESTURES.map((x) => h('button', { class: 'btn small', onclick: () => act(async () => { await thankAsResponder(x, r.asker, S.roomId); go('ask'); }, `「${x}」を送りました`) }, x))));
    }
    return h('div', { class: 'stack' },
      h('div', { class: 'row' }, h('button', { class: 'linkbtn', onclick: () => go('ask') }, '←'), h('div', { class: 'grow' }, h('b', {}, `${name(other)}さんと相談中`), h('div', { class: 'row wrap-row' }, marks(other, r.step))), h('span', { class: 'timer', id: 'timer' }, fmt(left))),
      r.link ? h('div', { class: 'linkbox' }, h('div', { class: 'meta' }, `${name(r.linkBy)}さんが貼ったリンク`), h('a', { href: r.link, target: '_blank', rel: 'noopener noreferrer' }, r.link)) : null,
      h('div', { class: 'card' }, h('div', { class: 'msgs' }, S.roomMsgs.length ? S.roomMsgs.map((m) => h('div', { class: 'msg' + (m.uid === S.me ? ' mine' : '') }, m.text)) : h('p', { class: 'muted' }, 'まだ何も話していません。リンクを貼るか、ひとこと送ってください。'))),
      h('div', { class: 'row' }, h('div', { class: 'grow' }, input), h('button', { class: 'btn primary', disabled: over, onclick: send }, '送る')),
      h('div', { class: 'warn' }, SECRET_NOTE),
      over ? h('p', { class: 'muted' }, '時間になりました。') : h('details', { id: 'linkd' }, h('summary', { class: 'muted' }, '会議・共有リンクを貼る'),
        h('div', { class: 'stack' }, url, h('label', { class: 'row muted' }, conf, '会社名・数字・顧客名を伏せました'), h('button', { class: 'btn', onclick: () => act(() => setLink(url.value, conf.checked), 'リンクを貼りました') }, '貼る'))),

  }
  const fmt = (ms) => { if (ms <= 0) return '0:00'; const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  function renderTimerOnly() { const t = $('timer'); if (t && S.room) { const left = S.room.endsAt - Date.now(); t.textContent = fmt(left); if (left <= 0 && !t.dataset.over) { t.dataset.over = '1'; render(); } } }

  // やめる（R6：行動の1つ。押すと、やめる決断の学びを3行書く）
  function viewQuit() {

  function lessonCard(l) {

      h('div', { class: 'row' }, h('span', { class: 'meta grow' }, `頭を下げた人 ${n}`), l.uid === S.me ? h('span', { class: 'meta' }, 'あなたの学び') : h('button', { class: 'btn small' + (mine ? ' on' : ''), disabled: mine || S.readOnly, onclick: () => act(() => bow(l)) }, mine ? '下げた' : '頭を下げる')));
  }
  function lessonForm(curStep) {
    const step = h('select', { id: 'lstep' }, STEPS.map((s, i) => h('option', { value: i + 1, selected: (curStep || 1) === i + 1 }, `${i + 1} ${s}`)));
    const type = h('select', { id: 'ltype' }, h('option', { value: 'stop' }, 'やめた'), h('option', { value: 'pivot' }, '方向を変えた'));

    const [a, la] = f('l1', 'わかったこと', '例：部長に見せる前に、使う人に聞くべきだった');
    const [b, lb] = f('l2', '次に持っていくもの', '例：過去の出来事を聞く質問');

      la, lb, lc,
      h('label', { class: 'row muted' }, show, '名前を出す'),
      h('div', { class: 'warn' }, SECRET_NOTE + '。公開前に運営者が読みます。'),
      h('button', { class: 'btn primary block', onclick: () => act(async () => { await submitLesson({ step: Number(step.value), type: type.value, learned: a.value, carry: b.value, drop: c.value, showName: show.checked }); await S.db.doc('logs/' + S.me).update({ quitAt: Date.now() }); S.quitDone = true; go('logs'); }, 'やめる決断を記録しました') }, 'やめる決断を記録する'));
  }

  // 学び（R7）：いまのステップと状況に合う背景・ヒントを1枚ずつ
  const STATE_LABEL = { none: '一手を書く前', lit: '一手に取り組み中', asking: '15分相談の最中', after: '相談のあと', done: '一手ができた', quit: 'やめる決断をした' };
  function learnContext() {
    const l = myLog();
    let state = 'none';
    if (l && isLit(l)) state = l.quitAt ? 'quit' : (mySign() || myResponding().length) ? 'asking' : pendingAskDone().length ? 'after' : l.doneAt ? 'done' : 'lit';
    return { state, step: l ? l.step : 1, hasLog: !!l };
  }
  function learnQueue(ctx) {
    const L = window.LESSONS || [];
    const byState = L.filter((x) => x.states && x.states.includes(ctx.state) && (!x.steps || x.steps.includes(ctx.step) || ctx.state === 'none'));
    const byStep = L.filter((x) => x.kind === 'tip' && !x.states && x.steps.includes(ctx.step));
    const bg = L.filter((x) => x.kind === 'bg');

  }
  async function markRead(id) {
    const read = Array.from(new Set([...(S.learnRead || []), id]));

  }
  function viewLearn() {
    const ctx = learnContext();
    const queue = learnQueue(ctx);
    const read = new Set(S.learnRead || []);
    const next = queue.find((x) => !read.has(x.id) && !S.learnSkip.includes(x.id)) || queue.find((x) => !read.has(x.id));
    const stepTips = (window.LESSONS || []).filter((x) => x.steps && x.steps.includes(ctx.step));
    const doneN = stepTips.filter((x) => read.has(x.id)).length;
    const readList = (window.LESSONS || []).filter((x) => read.has(x.id));
    const where = ctx.hasLog ? `ステップ${ctx.step} ${STEPS[ctx.step - 1]}・${STATE_LABEL[ctx.state]}` : STATE_LABEL.none;
    return h('div', {},
      h('h1', {}, '学び'),
      h('p', { class: 'lead' }, 'いまやっていることに合わせて、1枚ずつ。このプロダクトが必要とされる背景と、新規事業を進めるヒントです。'),
      h('span', { class: 'learn-ctx' }, `いま：${where}`),
      next ? h('article', { class: 'learn-card' },
        h('div', { class: 'row' }, h('span', { class: 'chip' + (next.kind === 'bg' ? '' : ' ember') }, next.kind === 'bg' ? '背景' : 'ヒント'), next.steps && next.kind === 'tip' ? h('span', { class: 'meta' }, `ステップ${next.steps.join('・')}`) : null),
        h('h2', {}, next.title),
        h('div', { class: 'body' }, next.body),
        h('div', { class: 'learn-try' }, h('b', {}, 'やってみる'), next.try),
        h('div', { class: 'learn-src' }, `出典：${next.src}`),

          h('button', { class: 'btn ghost', onclick: () => { S.learnSkip.push(next.id); render(); } }, 'あとで')))
        : h('div', { class: 'card stack' }, h('b', {}, 'いまの状況に合う学びは、すべて読みました'), h('div', { class: 'muted' }, '一手を進めたり、相談したりすると、次の学びが出てきます。')),
      h('h2', {}, `ステップ${ctx.step}の学び ${doneN} / ${stepTips.length}`),
      h('div', { class: 'learn-bar' }, h('i', { style: `width:${stepTips.length ? Math.round((doneN / stepTips.length) * 100) : 0}%` })),
      readList.length ? h('details', { id: 'learnread', style: 'margin-top:16px' }, h('summary', { class: 'muted' }, `読んだ学び ${readList.length}`),
        h('div', { class: 'stack', style: 'margin-top:8px' }, readList.map((x) => h('div', { class: 'card' }, h('b', {}, x.title), h('div', { class: 'muted' }, x.try))))) : null,
    );
  }

  // 通知
  function notifications() {
    const out = [];
    S.cheers.filter((c) => c.to === S.me).forEach((c) => out.push({ at: c.at, text: '誰かがあなたの一手を応援しました' }));
    S.thanks.forEach((t) => out.push({ at: t.at, text: `${name(t.from)}さんから「${t.g}」が届きました` }));
    S.signs.filter((s) => s.uid === S.me && s.status === 'offered').forEach((s) => out.push({ at: s.offeredAt, text: `${name(s.responder)}さんがあなたの相談に応じました`, go: 'ask' }));
    S.signs.filter((s) => s.responder === S.me && s.status === 'matched').forEach((s) => out.push({ at: s.startedAt, text: `${name(s.uid)}さんとの相談が始まりました`, go: 'ask' }));
    S.lessons.filter((l) => l.uid === S.me).forEach((l) => out.push({ at: l.publishedAt, text: 'あなたの学びが公開されました' }));
    S.bows.filter((b) => b.to === S.me).forEach((b) => out.push({ at: b.at, text: '誰かがあなたの学びに頭を下げました' }));

  function viewNotes() {

      h('h1', {}, '通知'),

        passed.length ? h('div', { class: 'row wrap-row' }, passed.map((s) => h('span', { class: 'chip ok' }, `${s} ${STEPS[s - 1]}`))) : h('div', { class: 'muted' }, 'まだありません。一手を「できた」にすると、そのステップの通過記録になります。'),
        S.experts.has(S.me) ? h('div', {}, h('span', { class: 'chip ember' }, '招待した経験者'), ' ', h('span', { class: 'muted' }, `ステップ ${expertSteps(S.me).join('・')}`)) : null),
      S.myPending.length ? h('div', { class: 'stack' }, h('h2', {}, 'あなたのやめる決断の学び（公開前）'), S.myPending.map((i) => h('div', { class: 'card stack' },
        h('div', { class: 'row' }, h('span', { class: 'chip' + (i.status === 'returned' ? ' ember' : '') }, i.status === 'returned' ? '運営者が戻しました' : '運営者の確認待ち'), h('span', { class: 'grow' }), h('button', { class: 'btn ghost small', onclick: () => act(() => deleteMyPending(i.id), '消しました') }, '消す')),
        h('div', { class: 'muted' }, i.learned)))) : null,
      h('h2', {}, '届いたもの'),
      list.length ? h('div', { class: 'stack' }, list.map((n) => h('div', { class: 'card row' }, h('div', { class: 'grow' }, h('div', {}, n.text), h('div', { class: 'meta' }, ago(n.at))), n.go ? h('button', { class: 'btn small', onclick: () => go(n.go) }, '開く') : null)))
        : h('p', { class: 'empty' }, 'まだ何も届いていません。'),
    );

  function renderBadges() {

    const s = mySign(); const askAlert = (s && s.status === 'offered') || myResponding().length;
    $('b-ask').hidden = !askAlert; $('b-ask').textContent = '!';

  // 運営者だけの画面
  let expertResults = [];
  function viewAdmin() {
    const items = S.allPending.flatMap((p) => (p.items || []).filter((i) => i.status === 'pending').map((i) => ({ owner: p.id, i })));
    const outs = S.allOutcomes.flatMap((o) => o.items || []);
    const moved = outs.filter((o) => o.movedOn).length;
    const done48 = outs.filter((o) => o.doneAt && o.doneAt - o.closedAt < 2 * DAY).length;

        return h('div', { class: 'card stack' }, h('b', {}, p.name), h('div', { class: 'row wrap-row' }, boxes), h('button', { class: 'btn small', onclick: () => act(() => setExpert(p.id, boxes.map((b) => b.querySelector('input')).filter((c) => c.checked).map((c) => Number(c.value))), '保存しました') }, '経験者として保存'));

        h('div', {}, `直近2週間で週3日以上の目安（14日で6日以上）灯した人：${active}`, h('span', { class: 'muted' }, '（合格基準：20人中5人）'))),
      h('h2', {}, `公開待ちの学び ${items.length}`),
      items.length ? h('div', { class: 'stack' }, items.map(({ owner, i }) => h('div', { class: 'card stack' },
        h('div', { class: 'meta' }, `${name(owner)}・ステップ${i.step}・${i.showName ? '名前を出す' : '名前なし'}`),
        h('div', {}, i.learned), h('div', {}, i.carry), h('div', {}, i.drop),
        h('div', { class: 'row' }, h('button', { class: 'btn primary small', onclick: () => act(() => approve(owner, i), '公開しました') }, '公開する'), h('button', { class: 'btn ghost small', onclick: () => act(() => sendBack(owner, i), '戻しました') }, '戻す'))))) : h('p', { class: 'empty' }, '公開待ちはありません。'),
      h('h2', {}, '招待した経験者'),
      h('div', { class: 'stack' }, [...S.experts.entries()].map(([uid, e]) => h('div', { class: 'card row' }, h('div', { class: 'grow' }, h('b', {}, name(uid)), h('div', { class: 'meta' }, `ステップ ${(e.steps || []).join('・')}`)), h('button', { class: 'btn ghost small', onclick: () => act(() => setExpert(uid, []), '外しました') }, '外す')))),
      h('div', { class: 'card stack' }, h('div', { class: 'muted' }, '同じ組織の人を名前で探して、経験者の印と、通ったステップを付けます。'), q, results),
    );
  }

  boot();
